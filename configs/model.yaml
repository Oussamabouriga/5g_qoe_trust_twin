experiment:
  random_seed: 42

target:
  name: "future_poor_qoe"
  mos_threshold: 3.0
  horizon_steps: 1

models:
  persistence:
    enabled: true

  logistic_regression:
    enabled: true
    class_weight: "balanced"
    max_iter: 2000

  random_forest:
    enabled: true
    n_estimators: 100
    max_depth: 14
    min_samples_leaf: 20
    max_samples: 0.50
    class_weight: "balanced_subsample"
    n_jobs: 4

calibration:
  fit_fraction: 0.50
  methods:
    - "sigmoid"
    - "isotonic"
