dataset:
  name: "5G-QoERA"
  directory: "data/external/5G-QoERA/5G-QoERA"
  file_pattern: "MOS_BS_*_Driver_PRB_*.tsv"
  separator: "\t"

video:
  selected_bitrates_kbps:
    - 2000
    - 4000
    - 6000
    - 8000

  bitrate_to_resolution:
    2000: "720p"
    4000: "1080p"
    6000: "1080p"
    8000: "1080p"

sessions:
  gap_threshold_seconds: 30

target:
  poor_mos_threshold: 3.0
  horizon_steps: 1

processing:
  output_file: "data/processed/qoe_modeling_dataset.parquet"
  sort_chronologically: true
  preserve_original_files: true

sample:
  input_file: "data/processed/friend_snapshot_quarantine/qoe_modeling_final_sample.parquet"
  input_sha256: "68ee536b88d294b9faa97b5e2c7d3eec4c46c07dc756d163b95ce32fa1d09100"
  provenance_manifest: "provenance/friend_snapshot_manifest.json"
  provenance_manifest_sha256: "d7bab12de9b512f99e174dd1b52bf48bfd646023f1d89dfc3c3359ef48b9001b"
  corrected_feature_file: "data/processed/qoe_features_final.parquet"
  split_manifest_file: "manifests/cp6_sample_split_manifest.json"

splitting:
  method: "global_chronological"
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
